services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gosu
      POSTGRES_PASSWORD: gosu_local
      POSTGRES_DB: gosu_finder
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: gosu_minio
      MINIO_ROOT_PASSWORD: gosu_minio_secret
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  centrifugo:
    image: centrifugo/centrifugo:v6.6.2
    ports:
      - "8000:8000"
    volumes:
      - ./centrifugo.json:/centrifugo/config.json:ro
    command: centrifugo -c config.json

volumes:
  pgdata:
  minio_data:
